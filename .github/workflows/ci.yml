name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test spike/plugin.test.ts
      - run: bun test spike/bridge.test.ts
      - run: bun run test:cli
      - name: entry exports only default
        run: bun -e 'import("./dist/index.js").then(m=>{const k=Object.keys(m);if(k.length!==1||k[0]!=="default"){console.error(k);process.exit(1)}})'
